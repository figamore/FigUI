name: Update Plugin Store

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test config compatibility and Studio loading
        run: npm run test:config && npm run test:studio

      - name: Build demo
        run: npm run build:demo

      - name: Build online Config Studio
        run: npm run build:studio

      - name: Preserve previous Config Studio builds
        run: node scripts/prepare-config-studio-pages.mjs

      - name: Preserve firmware from latest release
        run: |
          mkdir -p dist/firmware
          if ! RELEASE=$(gh api "repos/${{ github.repository }}/releases/latest"); then
            echo "Cannot restore the latest UI release; refusing to remove published downloads." >&2
            exit 1
          fi
          VERSION=$(printf '%s' "$RELEASE" | jq -r .tag_name)
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir -p "dist/firmware/$VERSION"
          HAS_LOCALIZED=$(printf '%s' "$RELEASE" | jq '[.assets[].name | select(test("^index\\.[A-Za-z0-9-]+\\.html\\.gz$"))] | length')
          for LOCALE in $(node --input-type=module -e 'import { enabledLanguages } from "./scripts/languages.mjs"; console.log(enabledLanguages().map(x => x.code).join(" "))'); do
            NAME="index.$LOCALE.html.gz"
            if [ "$LOCALE" = en ]; then NAME=index.html.gz; fi
            URL=$(printf '%s' "$RELEASE" | jq -r --arg name "$NAME" '.assets[] | select(.name == $name) | .browser_download_url')
            if [ -n "$URL" ]; then
              curl -fsSL "$URL" -o "dist/firmware/$VERSION/$NAME"
            elif [ "$LOCALE" = en ] || [ "$HAS_LOCALIZED" -gt 0 ]; then
              echo "Required $LOCALE UI is missing from the latest release" >&2
              exit 1
            fi
          done
          cp "dist/firmware/$VERSION/index.html.gz" dist/firmware/index.html.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
